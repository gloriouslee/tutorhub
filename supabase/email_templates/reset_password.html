<!--
  Supabase Dashboard -> Authentication -> Emails -> Templates -> "Reset password"

  Uses {{ .TokenHash }} instead of {{ .ConfirmationURL }} on purpose.
  {{ .ConfirmationURL }} routes through GoTrue /verify, which issues a PKCE code
  that only the browser holding the code-verifier cookie can exchange — so a link
  requested on a phone fails when opened on a laptop. A token hash is verified
  server-side in /auth/callback, so the link works on any device.

  Requires Site URL = https://www.toananhhuy.com (Authentication -> URL Configuration).
-->
<h2>Đặt lại mật khẩu TutorHub</h2>
<p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn.</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery">
    Đặt mật khẩu mới
  </a>
</p>
<p>Liên kết có hiệu lực trong 1 giờ và chỉ dùng được một lần.</p>
<p>Nếu bạn không yêu cầu đổi mật khẩu, hãy bỏ qua email này — tài khoản của bạn vẫn an toàn.</p>
<p>— TutorHub</p>
